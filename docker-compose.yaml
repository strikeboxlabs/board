name: board

services:
  board:
    build:
      context: .
      dockerfile: Dockerfile
    image: board
    container_name: board
    ports:
      - "8000:8000"
    volumes:
      - ./datas/board/:/root/.local/share/board/
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/projects', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 3s
    restart: unless-stopped
    command: ["uv", "run", "board", "serve", "--host", "0.0.0.0", "--no-access-log"]
  board-dispatcher:
    build:
      context: .
      dockerfile: Dockerfile
    image: board
    container_name: board-dispatcher
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dispatch.yaml:/board/dispatch.yaml
    depends_on:
      board:
        condition: service_healthy
    restart: unless-stopped
    command: ["uv", "run", "board", "dispatch", "--config", "dispatch.yaml"]
